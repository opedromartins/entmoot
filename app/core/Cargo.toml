[package]
name = "transcritor-core"
version = "0.0.1"
edition = "2021"

[lib]
name = "transcritor_core"

[[bin]]
name = "transcritor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
env_logger = "0.11"
futures-util = "0.3"
hound = "3.5"
log = "0.4"
ndarray = "0.16"
once_cell = "1"
ort = { version = "=2.0.0-rc.10" }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = "0.24"
ureq = "2"

# GPU inference goes through DirectML, which exists only on Windows.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.10", features = ["directml"] }
# Memory and GPU usage of this process, for the settings screen.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
