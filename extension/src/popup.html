<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>entmoot</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #1c1b1a;
      --muted: #6b6965;
      --line: #e4e2dd;
      --bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #ecebe8;
        --muted: #a3a09a;
        --line: #3a3936;
        --bg: #232221;
      }
    }
    body {
      margin: 0;
      padding: 12px 14px;
      width: 280px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, 'Segoe UI', sans-serif;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
    }
    section {
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
    }
    input {
      margin: 2px 0 0;
      accent-color: #2f7d4f;
    }
    .platform {
      font-weight: 600;
    }
    .option {
      margin: 8px 0 0 22px;
    }
    .option.unavailable {
      opacity: 0.5;
      cursor: default;
    }
    small {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    #reload {
      margin: 0;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>entmoot</h1>

  <section>
    <label class="platform">
      <input type="checkbox" data-key="meet">
      <span>Transcrever no Google Meet</span>
    </label>
    <label class="option">
      <input type="checkbox" data-key="meetCaptions" data-needs="meet">
      <span>
        Ligar as legendas sozinho
        <small>Pede as legendas ao Meet ao entrar. Nada aparece na tela.</small>
      </span>
    </label>
  </section>

  <section>
    <label class="platform">
      <input type="checkbox" data-key="teams">
      <span>Transcrever no Microsoft Teams</span>
    </label>
    <label class="option">
      <input type="checkbox" data-key="teamsCaptions" data-needs="teams">
      <span>
        Ligar as legendas sozinho
        <small>Clica no botão de legendas do Teams ao entrar, se ninguém as ligou. O painel de legendas aparece na tela. Experimental.</small>
      </span>
    </label>
  </section>

  <p id="reload" hidden>Recarregue a aba da reunião para a mudança valer.</p>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
